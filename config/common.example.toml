# 복사해서 config/common.toml로 쓴다. 파일이 없으면 아래 기본값으로 동작한다.

[gate]
# 멤버십 확인 결과(가입 확인 통과)를 캐시하는 시간(초)
cache_ttl = 60
# getChatMember 호출이 실패했을 때: "allow"(통과) | "block"(차단)
fail_mode = "allow"
# 관리자(.env의 ADMIN_IDS)는 게이트를 건너뛴다
exempt_admins = true

# 필수 채널. 봇이 각 채널의 관리자여야 getChatMember가 동작한다.
# 비공개 채널은 chat_id에 숫자(-100...)를, url에 초대 링크를 적는다.
# [[gate.channels]]
# chat_id = "@example_channel"
# url = "https://t.me/example_channel"
# title = "예시 채널"

[broadcast]
# 초당 발송 상한 (텔레그램 한도 30건 아래로 유지)
rate_per_sec = 25
