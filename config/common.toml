# 공통 설정. 항목 설명은 common.example.toml 참고.

[gate]
cache_ttl = 60
fail_mode = "allow"      # 가입 확인 API가 실패하면 통과시킨다 (봇이 채널 관리자가 아니면 이 상태가 됨)
exempt_admins = true     # 관리자는 게이트 면제. 가입 안내 화면을 직접 보려면 false로 바꿔서 확인한다

# 필수 가입 채널. 봇이 이 채널의 관리자여야 가입 여부를 확인할 수 있다.
[[gate.channels]]
chat_id = "@GGULLTIP"
url = "https://t.me/GGULLTIP"
title = "📢 채널 가입하기"

[broadcast]
rate_per_sec = 25
