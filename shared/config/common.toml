# 모든 봇이 같이 쓰는 공통 설정(통합 폴더). 항목 설명은 common.example.toml 참고.

[gate]
cache_ttl = 60
fail_mode = "block"      # 가입 확인 API가 실패하면 차단한다 (봇이 채널 관리자가 아니면 이 상태가 됨)
verifier_url = "http://127.0.0.1:8765"   # 검수 봇(verify)에게 가입 확인을 맡긴다. 주석 처리하면 각 봇이 직접 확인한다
exempt_admins = true     # 관리자는 게이트 면제. 가입 안내 화면을 직접 보려면 false로 바꿔서 확인한다

# 필수 가입 채널. 봇이 이 채널의 관리자여야 가입 여부를 확인할 수 있다.
[[gate.channels]]
chat_id = "@GGULLTIP"
url = "https://t.me/GGULLTIP"
title = "📢 채널 가입하기"

[broadcast]
rate_per_sec = 25
