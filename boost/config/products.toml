# 판매 상품. 바꾼 뒤에는 봇을 다시 시작해야 반영된다 (pm2 restart boost).
#
# service_id : SMM 패널의 서비스 ID. 0이면 아직 설정하지 않은 상품이라 판매 목록에 나오지 않는다.
# quantity   : 부스트 개수 (패널에 보내는 quantity)
# price      : 판매가 (USDT, 소수 6자리까지)
# days       : 유지 기간 안내용 (패널 서비스 설명과 맞춰 적는다)

[levels]            # 10레벨 계산기
target = 10         # 목표 레벨
divisor = 250       # 계수 = 구독자 수 // divisor + 1

[[products]]
id = "b10"
name = "부스트 10개"
service_id = 0
quantity = 10
price = "5.00"
days = 30

