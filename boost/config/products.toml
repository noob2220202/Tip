# 판매 상품. 바꾼 뒤에는 봇을 다시 시작해야 반영된다 (pm2 restart boost).
#
# service_id : SMM 패널의 서비스 ID. 0이면 아직 설정하지 않은 상품이라 판매 목록에 나오지 않는다.
# price      : 부스트 1개당 판매가 (USDT, 소수 6자리까지). 주문 금액 = price × 구매 개수
# (구매 개수는 사용자가 입력한다. 최소/최대는 아래 [order]로 바꿀 수 있다. quantity 항목은 더 이상 쓰지 않는다)
# days       : 유지 기간 안내용 (패널 서비스 설명과 맞춰 적는다)

[order]
min = 10            # 한 주문의 최소 부스트 개수
max = 1000          # 한 주문의 최대 부스트 개수

[levels]            # 10레벨 계산기
target = 10         # 목표 레벨
divisor = 250       # 채널 계수 = 구독자 수 // divisor + 1
group_divisor = 25  # 그룹 계수 = 멤버 수 // group_divisor + 1

[[products]]
id = "b10"
name = "부스트 30일"
service_id = 0
price = "0.50"
days = 30

[[products]]
id = "b30"
name = "부스트 15일"
service_id = 0
price = "0.30"
days = 30

[[products]]
id = "b100"
name = "부스트 7일"
service_id = 0
price = "0.15"
days = 30
